<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Treasury Rates Change Simulator</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
        }

        /* Glassmorphism utils */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38BDF8;
            margin-top: -6px;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>

<body class="min-h-screen lg:h-screen lg:overflow-hidden flex">
    <div id="root" class="w-full min-h-screen lg:h-full flex"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        function MetricCard({ label, value, delta, subtext }) {
            const isPos = delta > 0;
            const color = isPos ? 'text-emerald-400' : (delta < 0 ? 'text-rose-400' : 'text-slate-400');
            const sign = isPos ? '+' : '';

            return (
                <div className="glass p-5 rounded-xl flex flex-col justify-between hover:border-slate-500 transition-colors duration-300">
                    <div className="text-slate-400 text-sm font-medium tracking-wide uppercase">{label}</div>
                    <div className="text-3xl font-bold text-white mt-1">{value}</div>
                    <div className={`text-sm mt-3 font-mono flex items-center ${color}`}>
                        {delta !== null && <span className="mr-1">{sign}{delta} bps</span>}
                        {subtext && <span className="text-slate-500 ml-2 text-xs">{subtext}</span>}
                    </div>
                </div>
            );
        }

        function SliderControl({ label, value, min, max, onChange, help }) {
            return (
                <div className="mb-6">
                    <div className="flex justify-between items-end mb-2">
                        <label className="text-slate-300 text-sm font-medium">{label}</label>
                        <span className="text-sky-400 font-mono text-sm">{value > 0 ? '+' : ''}{value} bps</span>
                    </div>
                    <input
                        type="range"
                        aria-label={label}
                        min={min} max={max} value={value}
                        onChange={(e) => onChange(parseFloat(e.target.value))}
                        className="w-full"
                    />
                    {help && <div className="text-slate-500 text-xs mt-1">{help}</div>}
                </div>
            );
        }

        // --- MAIN APP ---

        function App() {
            const [data, setData] = useState({ original: {}, shocked: {}, metrics: {} });
            const [date, setDate] = useState("Loading...");
            const [error, setError] = useState(null);
            const [shockType, setShockType] = useState("parallel");
            const [magnitude, setMagnitude] = useState(0);
            const [customShocks, setCustomShocks] = useState({ 2: 0, 5: 0, 10: 0, 30: 0 });
            const [loading, setLoading] = useState(true);
            const [retry, setRetry] = useState(0);
            const [dataStatus, setDataStatus] = useState(null);
            const chartInstance = useRef(null);
            const chartRef = useRef(null);

            // One cancellable request owns the date, curve and metrics together.
            useEffect(() => {
                const controller = new AbortController();
                let active = true;
                setLoading(true);
                setError(null);
                const timer = setTimeout(async () => {
                    try {
                        const shocks = Object.fromEntries(Object.entries(customShocks).map(([t, v]) => [t, Number(v)]));
                        if (!Object.values(shocks).every(Number.isFinite)) {
                            throw new Error("Enter a finite shock in basis points.");
                        }
                        const apiPort = new URLSearchParams(window.location.search).get('apiPort') || '8081';
                        const apiBase = window.TREASURY_API_BASE || `http://${window.location.hostname || '127.0.0.1'}:${apiPort}`;
                        const res = await fetch(`${apiBase}/api/analyze`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            signal: controller.signal,
                            body: JSON.stringify({type: shockType, magnitude, pivot: 2.0, custom_shocks: shocks})
                        });
                        const json = await res.json();
                        if (!res.ok) {
                            const detail = Array.isArray(json.detail)
                                ? json.detail.map(item => item.msg).join('; ') : json.detail;
                            throw new Error(detail || `Request failed (${res.status}).`);
                        }
                        const original = json.original_curve;
                        if (!original || !Object.keys(original).length || !json.shocked_curve || !json.metrics ||
                            !Object.keys(original).every(t => Number.isFinite(original[t]) &&
                                Number.isFinite(json.shocked_curve[t]) && json.metrics[t] &&
                                Number.isFinite(json.metrics[t].yield) && Number.isFinite(json.metrics[t].delta_bps))) {
                            throw new Error("No usable Treasury curve was returned.");
                        }
                        if (!active) return;
                        setDate(json.date);
                        setDataStatus(json.data_status || null);
                        setData({original, shocked: json.shocked_curve, metrics: json.metrics});
                    } catch (err) {
                        if (active) setError(err.message || "Unable to fetch Treasury data.");
                    } finally {
                        if (active) setLoading(false);
                    }
                }, 50);
                return () => { active = false; clearTimeout(timer); controller.abort(); };
            }, [shockType, magnitude, customShocks, retry]);

            // Helper: Format Tenor (0.083 -> 1M, 30 -> 30Y)
            const formatTenor = (t) => {
                const val = parseFloat(t);
                if (val < 1) return Number((val * 12).toFixed(2)) + "M";
                return val + "Y";
            };

            // Chart Rendering logic using Chart.js
            useEffect(() => {
                if (!chartRef.current || Object.keys(data.original).length === 0) return;

                const tenors = Object.keys(data.original).sort((a, b) => parseFloat(a) - parseFloat(b));
                const labels = tenors.map(formatTenor); // Use pretty labels
                const origVals = tenors.map(t => data.original[t]);
                const shockVals = tenors.map(t => data.shocked[t]);

                if (chartInstance.current) {
                    chartInstance.current.data.labels = labels;
                    chartInstance.current.data.datasets[0].data = origVals;
                    chartInstance.current.data.datasets[1].data = shockVals;
                    chartInstance.current.update('none');
                } else {
                    const ctx = chartRef.current.getContext('2d');
                    const newChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                {
                                    label: 'Baseline',
                                    data: origVals,
                                    borderColor: '#64748B',
                                    borderDash: [5, 5],
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    tension: 0.4
                                },
                                {
                                    label: 'Scenario',
                                    data: shockVals,
                                    borderColor: '#38BDF8',
                                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                    fill: true,
                                    borderWidth: 3,
                                    pointRadius: 4,
                                    pointHoverRadius: 6,
                                    tension: 0.4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: { labels: { color: '#94A3B8' } },
                                tooltip: {
                                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                    titleColor: '#F8FAFC',
                                    bodyColor: '#E2E8F0',
                                    borderColor: '#334155',
                                    borderWidth: 1
                                }
                            },
                            scales: {
                                x: { title: { display: true, text: 'Maturity (categorical spacing)', color: '#94A3B8' }, grid: { color: '#1E293B' }, ticks: { color: '#64748B' } },
                                y: { title: { display: true, text: 'Yield (%)', color: '#94A3B8' }, grid: { color: '#1E293B' }, ticks: { color: '#64748B' } }
                            },
                            animation: { duration: 0 }
                        }
                    });
                    chartInstance.current = newChart;
                }
            }, [data, chartRef]);

            useEffect(() => () => { if (chartInstance.current) chartInstance.current.destroy(); }, []);

            // Metric Helpers
            const getM = (tenor) => {
                if (loading || error || !data.metrics) return { yield: "—", delta: null };
                const m = data.metrics[tenor + ".0"];
                return m ? { yield: m.yield.toFixed(2) + "%", delta: (m.delta_bps).toFixed(1) } : { yield: "—", delta: null };
            };

            const m2 = getM(2);
            const m10 = getM(10);
            const m30 = getM(30);

            return (
                <div className="flex flex-col lg:flex-row w-full min-h-screen lg:h-full bg-[#0F172A]">
                    {/* SIDEBAR */}
                    <div className="w-full lg:w-80 glass-panel p-6 flex flex-col shrink-0 lg:overflow-y-auto">
                        <div className="flex items-center space-x-2 mb-8">
                            <div className="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                            <h1 className="text-xl font-bold tracking-tight text-white">US Treasury Rates Change Simulator</h1>
                        </div>

                        <div className="mb-8">
                            <div className="text-slate-500 text-xs font-semibold uppercase mb-4 tracking-wider">Scenarios</div>

                            <div className="flex bg-slate-800 p-1 rounded-lg mb-6">
                                {['parallel', 'steepener', 'custom'].map(mode => (
                                    <button
                                        key={mode}
                                        aria-pressed={shockType === mode}
                                        onClick={() => { setShockType(mode); setMagnitude(0); }}
                                        className={`flex-1 py-1.5 text-xs font-medium rounded-md transition-all ${shockType === mode ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-300'
                                            }`}
                                    >
                                        {mode.charAt(0).toUpperCase() + mode.slice(1)}
                                    </button>
                                ))}
                            </div>

                            {shockType !== 'custom' ? (
                                <SliderControl
                                    label={shockType === 'parallel' ? 'Shift Magnitude' : 'Twist Severity'}
                                    value={magnitude} min={-200} max={200}
                                    onChange={setMagnitude}
                                    help={
                                        shockType === 'parallel'
                                            ? "Adds the same basis-point change to every available maturity."
                                            : "Keeps the 2Y yield unchanged. Shorter and longer maturities move in opposite directions."
                                    }
                                />
                            ) : (
                                <div className="space-y-4 animate-in fade-in duration-500">
                                    <div className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-2">Manual Shocks (bps)</div>
                                    <div className="grid grid-cols-2 gap-3">
                                        {[2, 5, 10, 30].map(t => (
                                            <div key={t} className="flex flex-col">
                                                <label className="text-slate-400 text-[10px] mb-1 font-mono">{t}Y</label>
                                                <input
                                                    type="number"
                                                    placeholder="0"
                                                    aria-label={`${t}Y shock (bps)`}
                                                    value={customShocks[t]}
                                                    className="w-full min-w-0 bg-slate-900 border border-slate-700 rounded p-2 text-sm text-sky-400 focus:outline-none focus:border-sky-500"
                                                    onChange={(e) => {
                                                        const val = e.target.value;
                                                        setCustomShocks(prev => ({ ...prev, [t]: val }));
                                                    }}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-slate-500 text-xs mt-4">
                                        Manually adjust specific points on the curve.
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="mt-auto">
                            <div className="p-4 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-400">
                                <span className="block mb-2 font-mono text-sky-400" role="status">
                                    {loading ? "Loading scenario…" : error ? "Scenario unavailable" : dataStatus && dataStatus.cache_status === 'stale' ? "STALE CACHE — refresh failed" : "Treasury daily observations"}
                                </span>
                                Observation date: {date === 'Loading...' && error ? 'Unavailable' : date}<br />
                                Source: US Treasury par yields<br />
                                <span className="block mt-2">Negative scenario yields are allowed. Risk estimates use an annual-compounding zero-coupon model with $100 face value.</span>
                            </div>
                        </div>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 min-w-0 flex flex-col p-4 sm:p-8 lg:overflow-y-auto relative" aria-busy={loading}>
                        {error && <div role="alert" className="mb-4 p-4 rounded-lg bg-rose-900 text-rose-100">
                            <p>Scenario unavailable: {error}</p>
                            <button className="mt-2 underline" onClick={() => setRetry(value => value + 1)}>Retry</button>
                        </div>}
                        {loading && <p className="mb-4 text-sky-300" role="status">Loading scenario…</p>}
                        {/* HEADER METRICS */}
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 shrink-0">
                            <MetricCard label="2Y Yield" value={m2.yield} delta={m2.delta} />
                            <MetricCard label="10Y Yield" value={m10.yield} delta={m10.delta} />
                            <MetricCard label="30Y Yield" value={m30.yield} delta={m30.delta} />
                        </div>

                        {/* CHART AREA */}
                        <div className="flex-1 glass rounded-2xl p-4 sm:p-6 relative flex flex-col min-h-[420px]">
                            <div className="mb-4">
                                <h2 className="text-lg font-semibold text-white">Yield Curve Structure</h2>
                                <p className="text-slate-400 text-sm">Par yields in percent; scenario changes in basis points</p>
                            </div>
                            <div className="flex-1 relative w-full min-h-[300px]">
                                <canvas ref={chartRef} role="img" aria-label="Baseline and scenario Treasury par yields by maturity" style={{visibility: loading || error ? 'hidden' : 'visible'}}></canvas>
                                {(loading || error) && <p className="absolute inset-0 flex items-center justify-center text-slate-400">{loading ? 'Waiting for scenario results…' : 'No current scenario result.'}</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
